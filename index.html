<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Explainer Studio</title>
<meta name="description" content="Generate the prompt that turns any material into an explainer website, ready to hand to a coding agent.">
<meta name="color-scheme" content="dark light">
<meta name="theme-color" content="#0c100e" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f5f3ec" media="(prefers-color-scheme: light)">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%230c100e'/%3E%3Cpath d='M44 15H22v34h22M22 32h16' fill='none' stroke='%23f2cf72' stroke-width='7' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="preload" href="src/fonts/inter-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="src/style.css">
</head>
<body>
<div class="aurora" aria-hidden="true"><i></i><i></i><i></i></div>

<header class="bar">
  <h1 class="logo">
    <svg viewBox="12 8 40 48" aria-hidden="true"><path d="M44 15H22v34h22M22 32h16"/></svg>
    <span>Explainer Studio</span>
  </h1>
  <div class="levels" role="radiogroup" id="levels"></div>
  <div class="bar__end">
    <select class="select select--bar" id="preset"></select>
    <div class="seg" role="radiogroup" id="uiLang"></div>
    <details class="menu" id="menu">
      <summary class="icon-btn" id="menuBtn">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/></svg>
      </summary>
      <div class="menu__list" role="menu">
        <button type="button" role="menuitem" data-action="export" data-i18n="exportAnswers"></button>
        <button type="button" role="menuitem" data-action="import" data-i18n="importAnswers"></button>
        <button type="button" role="menuitem" data-action="reset" data-i18n="reset"></button>
      </div>
    </details>
  </div>
</header>

<noscript><p class="noscript">Explainer Studio needs JavaScript enabled. · O Explainer Studio precisa de JavaScript ativado.</p></noscript>

<main class="work">
  <nav class="steps" id="stepsNav">
    <ol id="steps"></ol>
  </nav>

  <form id="form" autocomplete="off" novalidate></form>

  <aside class="preview" id="preview">
    <div class="preview__inner">
      <div class="preview__tools">
        <div class="seg" role="radiogroup" id="promptLang"></div>
        <label class="mini-switch">
          <input type="checkbox" role="switch" id="why"><span class="track" aria-hidden="true"></span><span data-i18n="why"></span>
        </label>
        <span class="preview__stats" id="stats" aria-live="polite"></span>
        <button type="button" class="icon-btn close-sheet" id="closeSheet">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
      </div>
      <div class="code" id="code" tabindex="0"></div>
      <div class="preview__actions">
        <button type="button" class="primary" id="copy">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="8" y="8" width="12" height="12" rx="3"/><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"/></svg>
          <span data-i18n="copy"></span>
        </button>
        <button type="button" class="ghost" id="download" data-i18n="download"></button>
      </div>
    </div>
  </aside>
</main>

<button type="button" class="fab" id="fab" aria-controls="preview" aria-expanded="false">
  <span data-i18n="prompt"></span><b id="fabCount"></b>
</button>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<input type="file" id="importFile" accept="application/json,.json" hidden>

<script src="src/schema.js"></script>
<script src="src/core.js"></script>
<script src="src/i18n.js"></script>
<script src="src/app.js"></script>
</body>
</html>
